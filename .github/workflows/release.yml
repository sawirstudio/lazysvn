name: release

# Builds and publishes a release with GoReleaser (see .goreleaser.yaml).
# Tags must be semver, e.g. v0.4.0.
#
# To re-run a release by hand, use "Run workflow" and pick the tag (not a
# branch) under "Use workflow from": the release environment only accepts
# v* tags.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Holds TAP_TOKEN and WINGET_TOKEN. Only v* tags may deploy to it and each
    # run waits for a reviewer's approval before the tokens reach this job.
    environment: release

    steps:
      # Actions are pinned to commit SHAs so a moved tag can't change the code
      # that runs next to the publishing tokens. The comment is the release.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Release
        uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
